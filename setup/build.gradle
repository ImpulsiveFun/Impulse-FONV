plugins { id 'com.android.application' version '8.7.3' }

android {
    namespace 'org.fnvprobe.setup'
    compileSdk 35
    defaultConfig {
        applicationId 'org.fnvprobe.setup'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    sourceSets.main.res.srcDirs = ['../android/src/main/res']
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
